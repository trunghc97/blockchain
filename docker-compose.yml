services:
  # Frontend (unchanged)
  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - public-network

  # API Gateway (updated with peer routing)
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_HOST=mongo-shared
      - SPRING_DATA_MONGODB_PORT=27017
      - SPRING_DATA_MONGODB_DATABASE=blockchain
      - SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE=admin
      - SPRING_DATA_MONGODB_USERNAME=root
      - SPRING_DATA_MONGODB_PASSWORD=example
      # Peer routing configuration
      - PEER_MAIN_BANK_URL=http://peer-main-bank:8082
      - PEER_SUPPLIER_URL=http://peer-supplier:8083
      - PEER_ANCHOR_URL=http://peer-anchor:8084
      # Blockchain service URL (use anchor peer as default)
      - BLOCKCHAIN_URL=http://peer-anchor:8084
    depends_on:
      - mongo-shared
      - peer-main-bank
      - peer-supplier
      - peer-anchor
    networks:
      - public-network
      - peer-network


  # Orderer Cluster (3 nodes) - PBFT consensus
  orderer-ord1:
    build:
      context: .
      dockerfile: ./orderer-cluster/Dockerfile
    ports:
      - "7050:7050"
    environment:
      - PBFT_NODE_ID=ord1
      - ORDERER_PORT=7050
      - PBFT_F=1
      - MONGO_URI=mongodb://root:example@mongo-shared:27017/blockchain?authSource=admin
    volumes:
      - ./secrets/ord1:/secrets
    depends_on:
      - mongo-shared
    networks:
      - orderer-network
      - public-network

  orderer-ord2:
    build:
      context: .
      dockerfile: ./orderer-cluster/Dockerfile
    ports:
      - "7060:7060"
    environment:
      - PBFT_NODE_ID=ord2
      - ORDERER_PORT=7060
      - PBFT_F=1
      - MONGO_URI=mongodb://root:example@mongo-shared:27017/blockchain?authSource=admin
    volumes:
      - ./secrets/ord2:/secrets
    depends_on:
      - mongo-shared
    networks:
      - orderer-network
      - public-network

  orderer-ord3:
    build:
      context: .
      dockerfile: ./orderer-cluster/Dockerfile
    ports:
      - "7070:7070"
    environment:
      - PBFT_NODE_ID=ord3
      - ORDERER_PORT=7070
      - PBFT_F=1
      - MONGO_URI=mongodb://root:example@mongo-shared:27017/blockchain?authSource=admin
    volumes:
      - ./secrets/ord3:/secrets
    depends_on:
      - mongo-shared
    networks:
      - orderer-network
      - public-network

  # Peer Nodes - now submit tx to Orderer via gRPC
  peer-main-bank:
    build: ./peer-main-bank
    ports:
      - "8082:8082"
      - "9095:9092"
    environment:
      - PEER_NODE_TYPE=main-bank
      - PEER_NODE_ID=main-bank-peer-1
      - PEER_PORT=8082
      - PEER_GRPC_PORT=9092
      - ORDERER_ADDR=orderer-ord1:7050
      - MONGO_URI=mongodb://root:example@mongo-shared:27017/blockchain_private?authSource=admin
    depends_on:
      - mongo-shared
      - orderer-ord1
    networks:
      - peer-network
      - public-network

  peer-supplier:
    build: ./peer-supplier
    ports:
      - "8083:8083"
      - "9093:9093"
    environment:
      - PEER_NODE_TYPE=supplier
      - PEER_NODE_ID=supplier-peer-1
      - PEER_PORT=8083
      - PEER_GRPC_PORT=9093
      - ORDERER_ADDR=orderer-ord1:7050
      - MONGO_URI=mongodb://root:example@mongo-shared:27017/blockchain_private?authSource=admin
    depends_on:
      - mongo-shared
      - orderer-ord1
    networks:
      - peer-network
      - public-network

  peer-anchor:
    build: ./peer-anchor
    ports:
      - "8084:8084"
      - "9094:9094"
    environment:
      - PEER_NODE_TYPE=anchor
      - PEER_NODE_ID=anchor-peer-1
      - PEER_PORT=8084
      - PEER_GRPC_PORT=9094
      - ORDERER_ADDR=orderer-ord1:7050
      - MONGO_URI=mongodb://root:example@mongo-shared:27017/blockchain_private?authSource=admin
    depends_on:
      - mongo-shared
      - orderer-ord1
    networks:
      - peer-network
      - public-network

  # Single MongoDB instance with dual databases (private + public)
  mongo-shared:
    image: mongo:latest
    container_name: blockchain-mongo-shared
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ./data/mongodb-shared:/data/db
    networks:
      - public-network
      - peer-network

# Network topology
networks:
  # Public-facing network for external access
  public-network:
    driver: bridge

  # Private network for peer-to-peer communication
  peer-network:
    driver: bridge
    internal: true

  # Isolated network for orderer PBFT consensus
  orderer-network:
    driver: bridge
    internal: true
