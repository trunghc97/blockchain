---
# Service Account for blockchain services
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blockchain-service-account
  namespace: blockchain-production
  labels:
    app.kubernetes.io/name: blockchain
    app.kubernetes.io/component: service-account

---
# Role for blockchain services
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blockchain-role
  namespace: blockchain-production
  labels:
    app.kubernetes.io/name: blockchain
    app.kubernetes.io/component: rbac
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blockchain-role-binding
  namespace: blockchain-production
  labels:
    app.kubernetes.io/name: blockchain
    app.kubernetes.io/component: rbac
subjects:
- kind: ServiceAccount
  name: blockchain-service-account
  namespace: blockchain-production
roleRef:
  kind: Role
  name: blockchain-role
  apiGroup: rbac.authorization.k8s.io

---
# ClusterRole for monitoring
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: blockchain-monitoring-role
  labels:
    app.kubernetes.io/name: blockchain
    app.kubernetes.io/component: monitoring
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions", "networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]

---
# ClusterRoleBinding for monitoring
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: blockchain-monitoring-role-binding
  labels:
    app.kubernetes.io/name: blockchain
    app.kubernetes.io/component: monitoring
subjects:
- kind: ServiceAccount
  name: blockchain-service-account
  namespace: blockchain-production
roleRef:
  kind: ClusterRole
  name: blockchain-monitoring-role
  apiGroup: rbac.authorization.k8s.io
