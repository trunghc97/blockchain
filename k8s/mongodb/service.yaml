apiVersion: v1
kind: Service
metadata:
  name: mongodb-shared
  namespace: blockchain-production
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: blockchain
spec:
  type: ClusterIP
  ports:
  - port: 27017
    targetPort: 27017
    name: mongodb
  selector:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-shared-headless
  namespace: blockchain-production
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: blockchain
spec:
  clusterIP: None
  ports:
  - port: 27017
    targetPort: 27017
    name: mongodb
  selector:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
