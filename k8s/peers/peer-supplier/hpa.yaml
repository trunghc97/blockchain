apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: peer-supplier-hpa
  namespace: blockchain-production
  labels:
    app.kubernetes.io/name: blockchain-peer
    app.kubernetes.io/component: autoscaling
    peer-type: supplier
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: peer-supplier
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
