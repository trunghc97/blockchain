apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: blockchain-production
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: blockchain
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: blockchain
    spec:
      serviceAccountName: blockchain-service-account
      containers:
      - name: frontend
        image: blockchain/frontend:latest  # Replace with your registry
        ports:
        - containerPort: 80
          name: http
        env:
        # API endpoint configuration
        - name: API_BASE_URL
          value: "https://your-domain.com/api"  # Replace with your domain
        - name: BACKEND_URL
          value: "http://backend.blockchain-production.svc.cluster.local:8080"
        # Environment
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: blockchain-config
              key: NODE_ENV
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
