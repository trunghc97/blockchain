apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: blockchain-alerts
  namespace: blockchain-production
  labels:
    app.kubernetes.io/name: blockchain
    app.kubernetes.io/component: monitoring
spec:
  groups:
  - name: blockchain-alerts
    rules:
    # Pod alerts
    - alert: PodCrashLooping
      expr: rate(kube_pod_container_status_restarts_total{namespace="blockchain-production"}[5m]) > 0.1
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Pod {{$labels.pod}} is crash looping"
        description: "Pod {{$labels.pod}} has restarted {{$value}} times in the last 5 minutes"

    - alert: PodNotReady
      expr: kube_pod_status_ready{namespace="blockchain-production", condition="false"} > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{$labels.pod}} is not ready"
        description: "Pod {{$labels.pod}} has been in not ready state for more than 5 minutes"

    # Application-specific alerts
    - alert: BackendDown
      expr: up{job="backend-monitor"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Backend API is down"
        description: "Backend API has been down for more than 2 minutes"

    - alert: OrdererDown
      expr: up{job="orderer-monitor"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Orderer cluster is down"
        description: "Orderer cluster has been down for more than 2 minutes"
