---
# ServiceMonitor for backend API
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-monitor
  namespace: blockchain-production
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/component: api
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 30s
    scrapeTimeout: 10s

---
# ServiceMonitor for peer nodes
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: peer-monitor
  namespace: blockchain-production
  labels:
    app.kubernetes.io/name: blockchain-peer
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: blockchain-peer
      app.kubernetes.io/component: peer
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s

---
# ServiceMonitor for orderer cluster
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: orderer-monitor
  namespace: blockchain-production
  labels:
    app.kubernetes.io/name: orderer
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: orderer
      app.kubernetes.io/component: consensus
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
