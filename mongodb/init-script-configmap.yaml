apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
  namespace: blockchain-production
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: init
data:
  init-mongo.js: |
    // Initialize replica set
    rs.initiate({
      _id: "rs0",
      members: [
        { _id: 0, host: "mongodb-shared-0.mongodb-shared.blockchain-production.svc.cluster.local:27017" },
        { _id: 1, host: "mongodb-shared-1.mongodb-shared.blockchain-production.svc.cluster.local:27017" },
        { _id: 2, host: "mongodb-shared-2.mongodb-shared.blockchain-production.svc.cluster.local:27017" }
      ]
    });

    // Create databases and users
    db = db.getSiblingDB('blockchain_shared');

    db.createUser({
      user: 'blockchain',
      pwd: 'secure_pass',
      roles: [
        { role: 'readWrite', db: 'blockchain_shared' },
        { role: 'dbAdmin', db: 'blockchain_shared' }
      ]
    });

    // Create collections for shared data
    db.createCollection('users');
    db.createCollection('user_sessions');

    // Create indexes
    db.users.createIndex({ "username": 1 }, { unique: true });
    db.users.createIndex({ "id": 1 }, { unique: true });
    db.users.createIndex({ "role": 1 });
    db.user_sessions.createIndex({ "userId": 1 });
    db.user_sessions.createIndex({ "createdAt": 1 }, { expireAfterSeconds: 86400 }); // 24 hours

    print("Shared database initialized successfully");

    // Initialize separate databases for each peer (will be created when peers start)
    print("MongoDB initialization completed");
