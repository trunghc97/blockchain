apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-shared
  namespace: blockchain-production
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: blockchain
spec:
  serviceName: mongodb-shared
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: blockchain
    spec:
      serviceAccountName: blockchain-service-account
      containers:
      - name: mongodb
        image: mongo:7.0
        ports:
        - containerPort: 27017
          name: mongodb
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            configMapKeyRef:
              name: blockchain-config
              key: MONGO_INITDB_ROOT_USERNAME
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: blockchain-secrets
              key: mongodb-root-password
        - name: MONGO_INITDB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: blockchain-config
              key: MONGO_INITDB_DATABASE
        # MongoDB replica set configuration
        - name: MONGO_REPLICA_SET_NAME
          value: "rs0"
        - name: MONGO_REPLICA_SET_KEY
          value: "replica-set-key-12345"
        # Performance tuning
        - name: MONGO_WIREDTIGER_CACHE_SIZE
          value: "1GB"
        - name: MONGO_OPLOG_SIZE
          value: "512"
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
        - name: mongodb-config
          mountPath: /data/configdb
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        livenessProbe:
          exec:
            command:
            - mongo
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          exec:
            command:
            - mongo
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: mongodb-config
        emptyDir: {}
      - name: init-script
        configMap:
          name: mongodb-init
          defaultMode: 0755
  volumeClaimTemplates:
  - metadata:
      name: mongodb-data
      namespace: blockchain-production
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/component: database
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 50Gi
      storageClassName: fast-ssd  # Adjust based on your cluster
