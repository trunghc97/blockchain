server:
  port: 8080

spring:
  data:
    mongodb:
      host: mongo
      port: 27017
      database: blockchain
      username: root
      password: example
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Peer routing configuration
peer:
  main-bank:
    url: ${PEER_MAIN_BANK_URL:http://peer-main-bank:8082}
  supplier:
    url: ${PEER_SUPPLIER_URL:http://peer-supplier:8083}
  anchor:
    url: ${PEER_ANCHOR_URL:http://peer-anchor:8084}

logging:
  level:
    org.springframework.security: DEBUG
    com.example.blockchain: DEBUG