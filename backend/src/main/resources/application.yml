server:
  port: 8080

# Primary MongoDB connection (Private Blockchain)
spring:
  data:
    mongodb:
      host: mongo-shared
      port: 27017
      database: blockchain_private
      username: root
      password: example

# Secondary MongoDB connection (Public Blockchain)
mongodb:
  public:
    host: mongo-shared
    port: 27017
    database: blockchain_public
    username: root
    password: example

blockchain:
  url: http://peer-anchor:8084
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Peer routing configuration
peer:
  main-bank:
    url: ${PEER_MAIN_BANK_URL:http://peer-main-bank:8082}
  supplier:
    url: ${PEER_SUPPLIER_URL:http://peer-supplier:8083}
  anchor:
    url: ${PEER_ANCHOR_URL:http://peer-anchor:8084}

logging:
  level:
    org.springframework.security: DEBUG
    com.example.blockchain: DEBUG
