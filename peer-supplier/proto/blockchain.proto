syntax = "proto3";

package blockchain;
option go_package = "shared/proto";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// Block represents a blockchain block with PBFT signatures
message Block {
  int64 height = 1;
  google.protobuf.Timestamp timestamp = 2;
  repeated Transaction transactions = 3;
  string previous_hash = 4;
  string hash = 5;
  string merkle_root = 6;
  repeated BlockSignature signatures = 7;
}

// BlockSignature represents a PBFT signature from an orderer
message BlockSignature {
  string orderer_id = 1;
  bytes signature = 2;
  string public_key = 3;
}

// Transaction represents a blockchain transaction
message Transaction {
  string transaction_id = 1;
  string transaction_type = 2;
  string contract_id = 3;
  string token_id = 4;
  string sender_id = 5;
  string receiver_id = 6;
  double amount = 7;
  string payload = 8;
  google.protobuf.Timestamp timestamp = 9;
}

// Consensus message types for PBFT
message PrePrepareMessage {
  string view = 1;
  string sequence_number = 2;
  Block block = 3;
  string digest = 4;
}

message PrepareMessage {
  string view = 1;
  string sequence_number = 2;
  string digest = 3;
  string orderer_id = 4;
}

message CommitMessage {
  string view = 1;
  string sequence_number = 2;
  string digest = 3;
  string orderer_id = 4;
}

message ConsensusMessage {
  string type = 1; // PRE_PREPARE, PREPARE, COMMIT
  oneof message {
    PrePrepareMessage pre_prepare = 2;
    PrepareMessage prepare = 3;
    CommitMessage commit = 4;
  }
}

// PBFT Orderer service - replaces Kafka-based ordering
service OrdererService {
  rpc SubmitTx (SubmitTxRequest) returns (SubmitTxReply);
  rpc StreamBlocks (StreamBlocksRequest) returns (stream Block);
  rpc Consensus (ConsensusMessage) returns (AckReply);
}

// Orderer service messages
message SubmitTxRequest {
  string peer_id = 1;
  Transaction transaction = 2;
}

message SubmitTxReply {
  bool success = 1;
  string transaction_id = 2;
  string message = 3;
}

message StreamBlocksRequest {
  string peer_id = 1;
  int64 start_height = 2; // optional: start from specific height
}

message AckReply {
  bool success = 1;
  string message = 2;
}
