---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: blockchain-production
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: blockchain
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: blockchain-production
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: blockchain
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: blockchain
    spec:
      serviceAccountName: blockchain-service-account
      containers:
      - name: frontend
        image: blockchain/frontend:latest  # Replace with your registry
        ports:
        - containerPort: 80
          name: http
        env:
        # API endpoint configuration
        - name: API_BASE_URL
          value: "https://your-domain.com/api"  # Replace with your domain
        - name: BACKEND_URL
          value: "http://backend.blockchain-production.svc.cluster.local:8080"
        # Environment
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: blockchain-config
              key: NODE_ENV
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blockchain-ingress
  namespace: blockchain-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: blockchain
spec:
  tls:
  - hosts:
    - your-domain.com  # Replace with your actual domain
    secretName: blockchain-tls
  rules:
  - host: your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
