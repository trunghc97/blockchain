<div class="contract-form-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        <mat-icon>add</mat-icon>
        Tạo hợp đồng mới
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="contractForm" (ngSubmit)="onSubmit()">
        <!-- Mô tả -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Mô tả hợp đồng</mat-label>
          <textarea matInput formControlName="description" rows="3" required
                   placeholder="Nhập mô tả chi tiết về hợp đồng"></textarea>
          <mat-error *ngIf="contractForm.get('description')?.hasError('required') && contractForm.get('description')?.touched">
            Vui lòng nhập mô tả
          </mat-error>
        </mat-form-field>

        <!-- Info display -->
        <div class="info-display">
          <div class="info-item">
            <label>Tổng số tiền</label>
            <div class="info-value">{{ totalAmount | currency:'VND':'symbol':'1.0-0' }}</div>
          </div>
        </div>

        <!-- Suppliers Section -->
        <div class="suppliers-section">
          <h4>Danh sách nhà cung cấp</h4>
          <div formArrayName="suppliers">
            <div *ngFor="let supplier of suppliers.controls; let i = index" class="supplier-item" [formGroupName]="i">
              <div class="supplier-row">
                <mat-form-field appearance="outline">
                  <mat-label>ID Supplier {{i + 1}}</mat-label>
                  <mat-select formControlName="supplierId" required>
                    <mat-option value="">-- Chọn nhà cung cấp --</mat-option>
                    <mat-option *ngFor="let availableSupplier of availableSuppliers" [value]="availableSupplier.id">
                      {{ availableSupplier.id }} - {{ availableSupplier.username }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline">
                  <mat-label>Tên Supplier {{i + 1}}</mat-label>
                  <input matInput formControlName="name" readonly>
                </mat-form-field>

                <mat-form-field appearance="outline">
                  <mat-label>Số tiền</mat-label>
                  <input matInput type="number" formControlName="amount" step="0.01" min="0" required>
                </mat-form-field>

                <button mat-icon-button color="warn" type="button" (click)="removeSupplier(i)" *ngIf="suppliers.length > 1">
                  <mat-icon>remove</mat-icon>
                </button>
              </div>
            </div>
          </div>
          <button mat-stroked-button type="button" (click)="addSupplier()">
            <mat-icon>add</mat-icon>
            Thêm nhà cung cấp
          </button>
        </div>

        <!-- Submit Button -->
        <div class="action-buttons">
          <button mat-raised-button color="primary" type="submit" [disabled]="contractForm.invalid || loading">
            <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
            <span *ngIf="!loading">Tạo hợp đồng</span>
          </button>
          <button mat-button type="button" routerLink="/contracts">
            <mat-icon>arrow_back</mat-icon>
            Quay lại
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
